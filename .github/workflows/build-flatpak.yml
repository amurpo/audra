name: Build Flatpak

on:
  workflow_call:
    inputs:
      ver:
        required: true
        type: string
    secrets:
      LASTFM_PROXY_URL:
        required: true

jobs:
  build-flatpak:
    name: Build Flatpak (bundle)
    runs-on: ubuntu-latest
    # Fedora image with flatpak-builder installed directly, instead of the
    # flathub-maintained GitHub Action. --privileged is needed so bubblewrap
    # can set up the build sandbox inside the container.
    container:
      image: fedora:latest
      options: --privileged
    env:
      VER: ${{ inputs.ver }}
      LASTFM_PROXY_URL: ${{ secrets.LASTFM_PROXY_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Check proxy secret
        # No proxy URL means scrobbling is dead in the bundle, so refuse to
        # build rather than ship a broken .flatpak.
        run: |
          if [ -z "$LASTFM_PROXY_URL" ]; then
            echo "::error::LASTFM_PROXY_URL is not set; aborting the Flatpak build."
            exit 1
          fi

      - name: Deps
        run: |
          dnf install -y \
            flatpak flatpak-builder \
            appstream \
            git python3-pyyaml

      - name: Check cargo-sources.json is in sync with Cargo.lock
        # The offline vendored build fails deep inside flatpak-builder when
        # cargo-sources.json lags behind Cargo.lock (it is generated by hand
        # with flatpak-cargo-generator.py). Fail fast with an actionable
        # message instead.
        run: |
          python3 - <<'PY'
          import json, sys, tomllib
          with open('Cargo.lock', 'rb') as f:
              lock = tomllib.load(f)
          locked = {(p['name'], p['version']) for p in lock['package']
                    if p.get('source', '').startswith('registry+')}
          have = set()
          for e in json.load(open('cargo-sources.json')):
              if e.get('type') == 'archive' and '/crates/' in e.get('url', ''):
                  name, fname = e['url'].rsplit('/', 2)[-2:]
                  have.add((name, fname[len(name) + 1:-len('.crate')]))
          missing = locked - have
          stale = have - locked
          for n, v in sorted(missing):
              print(f'::error::cargo-sources.json is missing {n} {v}')
          for n, v in sorted(stale):
              print(f'::error::cargo-sources.json has {n} {v}, no longer in Cargo.lock')
          if missing or stale:
              sys.exit('cargo-sources.json is out of sync with Cargo.lock. Regenerate it: '
                       'python3 flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json '
                       '(from flatpak/flatpak-builder-tools).')
          print(f'cargo-sources.json matches Cargo.lock ({len(locked)} crates).')
          PY

      - name: Add Flathub remote (runtime source only)
        run: |
          flatpak remote-add --user --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Generate CI manifest
        # The committed manifest pins a git commit (for Flathub) and does not
        # carry the proxy URL. For a CI bundle we build the checked-out tree
        # and bake LASTFM_PROXY_URL into build-options.env so build.rs picks
        # it up — mirroring how the other packaging workflows pass the secret.
        run: |
          python3 - <<'PY'
          import os, sys, yaml
          proxy = os.environ.get('LASTFM_PROXY_URL', '')
          if not proxy:
              sys.exit('LASTFM_PROXY_URL empty: manifest not generated.')
          with open('io.github.amurpo.audra.yml') as f:
              manifest = yaml.safe_load(f)
          module = manifest['modules'][0]
          module['sources'] = [
              {'type': 'dir', 'path': '.',
               'skip': ['.git', '.flatpak-builder', 'target',
                        'build', 'build-dir', 'flatpak-build', 'flatpak-repo']},
              'cargo-sources.json',
          ]
          env = manifest.setdefault('build-options', {}).setdefault('env', {})
          env['LASTFM_PROXY_URL'] = proxy
          with open('audra-ci.yml', 'w') as f:
              yaml.safe_dump(manifest, f, sort_keys=False)
          PY

      - name: Build
        run: |
          flatpak-builder \
            --user \
            --disable-rofiles-fuse \
            --force-clean \
            --install-deps-from=flathub \
            --build-only \
            flatpak-build audra-ci.yml

      - name: Compose AppStream catalog
        # Runs on the runner, not inside the build sandbox: the GNOME SDK's
        # appstream renders icons through glycin, whose loader sandbox
        # (flatpak-spawn) cannot work nested inside the flatpak-builder build
        # environment. Fedora's appstream renders SVGs via librsvg directly.
        # Composing outside the sandbox mirrors how Flathub does it server-side.
        run: |
          STAGE="$RUNNER_TEMP/as-stage"
          OUT="$RUNNER_TEMP/compose-out"
          mkdir -p "$STAGE/app/share/metainfo" \
                   "$STAGE/app/share/applications" \
                   "$STAGE/app/share/icons/hicolor/scalable/apps"
          cp flatpak-build/files/share/metainfo/io.github.amurpo.audra.metainfo.xml \
            "$STAGE/app/share/metainfo/"
          cp flatpak-build/files/share/applications/io.github.amurpo.audra.desktop \
            "$STAGE/app/share/applications/"
          cp flatpak-build/files/share/icons/hicolor/scalable/apps/io.github.amurpo.audra.svg \
            "$STAGE/app/share/icons/hicolor/scalable/apps/"
          appstreamcli compose \
            --prefix=/app \
            --origin=flatpak \
            --no-net \
            --print-report=full \
            --result-root="$OUT" \
            "$STAGE"
          mkdir -p flatpak-build/files/share/swcatalog
          cp -r "$OUT/app/share/swcatalog/." flatpak-build/files/share/swcatalog/

      - name: Export to repo
        run: |
          flatpak-builder \
            --user \
            --disable-rofiles-fuse \
            --finish-only \
            --repo=flatpak-repo \
            flatpak-build audra-ci.yml

      - name: Bundle
        run: |
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            "audra-${VER}-x86_64.flatpak" \
            io.github.amurpo.audra

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: audra-*.flatpak
